# SonarQube/SonarCloud Configuration for k8s-nim-operator
# This file configures the SonarQube scanner for the NVIDIA k8s-nim-operator project

sonar.projectKey=COG-GTM_k8s-nim-operator
sonar.projectName=k8s-nim-operator
sonar.organization=cog-gtm

# Source encoding
sonar.sourceEncoding=UTF-8

# Go source and test paths
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclusions for generated code, vendor, and build artifacts
sonar.exclusions=**/vendor/**,**/bundle/**,**/config/**,**/manifests/**,**/deployments/**,**/*_mock.go,**/zz_generated*.go,**/*.pb.go

# Go coverage report path (generated by `make coverage`)
sonar.go.coverage.reportPaths=cover.out

# Quality gate settings
sonar.qualitygate.wait=true
